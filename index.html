<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월구 - 낙천사영역 | Divina Luna</title>

    <!-- Open Graph / Social Media Preview Cards -->
    <meta name="description" content="신께서 더 이상 응답하지 아니하시니, 너희들은 직접 무기를 들라. - Divina Luna">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://little-sunj.github.io/divina-paradiso/">
    <meta property="og:title" content="월구 - 낙천사영역">
    <meta property="og:description" content="신께서 더 이상 응답하지 아니하시니, 너희들은 직접 무기를 들라.">
    <meta property="og:image" content="https://little-sunj.github.io/divina-paradiso/assets/images/og-thumb.png">
    <meta property="og:image:alt" content="DIVINA LUNA - 월구 - 낙천사영역">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="월구 - 낙천사영역">
    <meta name="twitter:description" content="신께서 더 이상 응답하지 아니하시니, 너희들은 직접 무기를 들라.">
    <meta name="twitter:image" content="https://little-sunj.github.io/divina-paradiso/assets/images/og-thumb.png">

    <!-- Google Fonts: Noto Serif for elegant Latin, Noto Serif KR for Korean, Material Symbols Outlined for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <!-- 1. Intro Screen -->
    <div id="intro-screen">
        <div class="intro-bg-glow"></div>
        <div id="intro-content">
            <div class="intro-badge">DIVINA LUNA</div>
            <div class="intro-sphere">월구</div>
            <h1 class="intro-title">낙천사영역</h1>
            <p class="intro-quote">"신께서 더 이상 응답하지 아니하시니,<br>너희들은 직접 무기를 들라."</p>
            <div class="enter-prompt">
                <span class="pulse-text">CLICK</span>
                <span class="material-symbols-outlined arrow-down">keyboard_double_arrow_down</span>
            </div>
        </div>
        <!-- Hidden Image preloaders to bypass file:// local WebGL CORS blocks -->
        <div style="display: none;">
            <img id="img-og-thumb" src="assets/images/og-thumb.png" alt="DIVINA LUNA - 월구 - 낙천사영역">
            <img id="img-moon" src="assets/images/moon.jpg">
            <img id="img-earth" src="assets/images/earth.jpg">
            <img id="img-earth-night" src="assets/images/earth_night.jpg">
        </div>
    </div>

    <!-- 2. Main Page Container -->
    <div id="main-container" class="hidden">
        <div class="main-bg-glow"></div>
        <div class="stars-bg"></div>

        <!-- Vertical Center Axis Line representing the Tower spine -->
        <div class="center-axis-line">
            <div class="axis-vertical-title">
                <span class="axis-vertical-text">달의그림자탑</span>
            </div>
        </div>

        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <div class="nav-brand">
                <span class="brand-sub">DIVINA LUNA</span>
                <span class="brand-title"><span class="material-symbols-outlined brand-icon">dark_mode</span> 월구 - 낙천사영역</span>
            </div>
            <div class="nav-right">
                <nav class="nav-links" id="nav-links">
                    <button class="nav-btn" id="btn-open-worldview">
                        <span class="material-symbols-outlined">auto_stories</span> 세계관
                    </button>
                    <button class="nav-btn" id="btn-open-characters">
                        <span class="material-symbols-outlined">group</span> 등장인물
                    </button>
                    <button class="nav-btn" id="btn-open-author-notes">
                        <span class="material-symbols-outlined">edit_note</span> 제작노트
                    </button>
                </nav>
                <!-- Compact BGM Player in GNB -->
                <div class="bgm-player" id="bgm-player">
                    <audio id="bgm-audio" loop preload="auto" src="assets/sound/ANGELI LUNAE.mp3"></audio>
                    <button class="bgm-btn" id="bgm-toggle-btn" title="배경음악 재생 / 일시정지" aria-label="BGM 재생/일시정지">
                        <span class="material-symbols-outlined" id="bgm-icon">play_arrow</span>
                    </button>
                    <div class="bgm-info">
                        <div class="bgm-waves" id="bgm-waves">
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                            <span class="wave-bar"></span>
                        </div>
                        <span class="bgm-title">ANGELI LUNAE</span>
                    </div>
                    <div class="bgm-volume-wrap">
                        <span class="material-symbols-outlined volume-icon" id="volume-icon">volume_up</span>
                        <input type="range" id="bgm-volume" class="bgm-volume-slider" min="0" max="1" step="0.05" value="1" title="음량 조절">
                    </div>
                </div>
                <!-- Hamburger Button for Mobile -->
                <button class="nav-hamburger" id="nav-hamburger" aria-label="메뉴 열기/닫기" aria-expanded="false">
                    <span class="material-symbols-outlined" id="nav-hamburger-icon">menu</span>
                </button>
            </div>
        </header>

        <!-- Upper Part: Glowing and Rotating Moon (Sphere of the Moon / 월구) -->
        <div class="moon-wrapper">
            <div class="moon-tag">천계 관문 · 월구 (Primo Cielo)</div>
            <div class="moon-glow"></div>
            <div class="moon" id="moon-canvas-container"></div>
        </div>

        <!-- Middle Part: Interactive 7 Floor Orbit Layers (Tower of Moon's Shadow 1F~7F - Loaded from data/floors.json) -->
        <div class="orbits-container" id="orbits-container"></div>

        <!-- Lower Part: Earth (Mortal Realm / 인간계 전장) -->
        <div class="earth-wrapper">
            <div class="earth-tag">인간계 전장 · 고립된 하계 (Mortal Earth)</div>
            <div class="earth-glow"></div>
            <div class="earth" id="earth-canvas-container"></div>
        </div>
    </div>

    <!-- 3. Floor Detail Modal (1층 ~ 7층 - Loaded from data/floors.json) -->
    <div id="detail-container" class="hidden modal-backdrop">
        <!-- Close Button -->
        <button class="close-btn"><span class="material-symbols-outlined">close</span> SPACE MAP</button>
        <div id="detail-cards-container"></div>
    </div>

    <!-- 4. Worldview & Prologue Modal - Fullscreen -->
    <div id="worldview-modal" class="hidden modal-backdrop fullscreen-modal">
        <div class="modal-box worldview-box">
            <button class="modal-close-btn" id="btn-close-worldview" title="닫기"><span class="material-symbols-outlined">close</span></button>
            <div class="modal-header">
                <span class="section-tag" id="worldview-tag">DIVINA LUNA LORE</span>
                <h2 id="worldview-title">세계관</h2>
                <div class="gold-line"></div>
            </div>
            
            <!-- Chapter Tabs Navigation (Loaded dynamically from data/worldview.json) -->
            <div class="tab-slider-tabs" id="worldview-tabs-container"></div>

            <!-- Content Panes (Loaded dynamically from data/worldview.json) -->
            <div class="modal-body-scroll tab-slider-panes" id="worldview-panes-container"></div>
        </div>
    </div>

    <!-- 5. Characters Dossier Modal - Fullscreen -->
    <div id="characters-modal" class="hidden modal-backdrop fullscreen-modal">
        <div class="modal-box characters-box">
            <!-- Fullscreen Dynamic Character Wide Blurred Background (Dual-layer Crossfade) -->
            <div class="char-backdrop-wrap" id="char-backdrop-wrap">
                <div class="char-backdrop-img active" id="char-backdrop-a"></div>
                <div class="char-backdrop-img" id="char-backdrop-b"></div>
                <div class="char-backdrop-overlay"></div>
            </div>

            <button class="modal-close-btn" id="btn-close-characters" title="닫기"><span class="material-symbols-outlined">close</span></button>
            <div class="modal-header">
                <span class="section-tag">CHARACTER DOSSIER</span>
                <h2>등장인물</h2>
                <div class="gold-line"></div>
            </div>

            <!-- Character Tabs Navigation (Loaded dynamically from data/characters.json) -->
            <div class="tab-slider-tabs" id="char-tabs-container"></div>

            <!-- Character Content Panes (Loaded dynamically from data/characters.json) -->
            <div class="modal-body-scroll tab-slider-panes" id="char-panes-container"></div>
        </div>
    </div>

    <!-- 6. Author's Notes (Deep Lore) Fullscreen Modal -->
    <div id="author-notes-modal" class="hidden modal-backdrop fullscreen-modal">
        <div class="modal-box author-notes-box">
            <button class="modal-close-btn" id="btn-close-author-notes" title="닫기"><span class="material-symbols-outlined">close</span></button>
            <div class="modal-header">
                <span class="section-tag" id="author-notes-tag">PRODUCTION NOTES & DEEP LORE</span>
                <h2 id="author-notes-title">제작노트</h2>
                <div class="gold-line"></div>
            </div>

            <!-- Author Notes Tabs Navigation (Loaded dynamically from data/author_notes.json) -->
            <div class="tab-slider-tabs" id="author-notes-tabs-container"></div>

            <!-- Content Panes (Loaded dynamically from data/author_notes.json) -->
            <div class="modal-body-scroll tab-slider-panes" id="author-notes-panes-container"></div>
        </div>
    </div>

    <!-- Three.js and Anime.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="src/js/script.js"></script>
</body>
</html>
